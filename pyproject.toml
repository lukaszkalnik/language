# uv workspace root: no code of its own, only shared dev tooling.
# Each tool keeps its own heavy dependencies, so `uv sync --package <tool>`
# installs only what that tool needs.
[project]
name = "language-workspace"
version = "0.1.0"
description = "Workspace root for the language tools (accent, vocals, transcribe, translate)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Unit tests import the sources directly (see pythonpath below) and need no models,
# so the root environment stays small: no torch, no model libraries.
dev = [
    "pytest==9.2.0", "ruff==0.17.5", "basedpyright==1.40.2",
    "numpy==2.4.6", "scipy==1.17.1", "py3langid==0.4.0",
]
# Small libraries some unit tests need: the model-cache checks (huggingface_hub, as ingest
# pins it; PyYAML for Demucs' bag files). Installed by default with dev, but unlike dev's
# libraries sources may import them only inside functions (tests/test_architecture.py).
model-tests = ["huggingface-hub==2.4.0", "pyyaml==6.0.3"]

[tool.uv]
package = false
default-groups = ["dev", "model-tests"]
# Apple Silicon first; Linux and Windows kept portable. Intel Macs are left out: current
# PyTorch no longer ships wheels for them (and Demucs pins numpy<2 there).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = ["packages/ingest", "tools/accent", "tools/vocals", "tools/transcribe", "tools/translate", "tools/gui"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "tools"]
markers = [
    "integration: needs network and/or downloads a model (run with: uv run pytest -m integration)",
]
pythonpath = [
    "packages/ingest/src",
    "tools/accent/src",
    "tools/vocals/src",
    "tools/transcribe/src",
    "tools/translate/src",
    "tools/gui/src",
]
addopts = "-m 'not integration' --import-mode=importlib"

# Type checking (pyright's checker, as basedpyright: it brings its own Node, no download at run time).
# tests/test_types.py runs it with only the root environment's libraries visible, so the result is
# the same with or without the tools' libraries installed. Errors from before the check are in
# .basedpyright/baseline.json (fixed ones drop out with --writebaseline, new ones fail).
[tool.basedpyright]
include = ["packages", "tools", "tests", "conftest.py"]
exclude = ["**/.venv", "**/build", "**/dist", "build", "dist"]
extraPaths = [
    "packages/ingest/src",
    "tools/accent/src",
    "tools/vocals/src",
    "tools/transcribe/src",
    "tools/translate/src",
    "tools/gui/src",
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# See docs/architecture.md. Left out on purpose: PTH, BLE, T20, PL, TRY, EM, FBT, S (task 0008).
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PIE", "PERF", "ISC", "N", "TID", "ICN", "RUF"]
ignore = [
    "E501",
    "N818",  # exception names keep their meaning (Cancelled, StepFailed) without an Error suffix
    "RUF001", "RUF002", "RUF003",  # typographic dashes and quotes in messages are intended
    "RUF046",  # int(round(x)) stays: x is often a numpy value
    "SIM905",  # a word list written as one string and split() reads better than a long list literal
]
# BLE is not selected, but its noqa comments mark deliberate broad catches: keep them.
external = ["BLE"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "accent", "vocals", "transcribe", "translate", "gui"]
